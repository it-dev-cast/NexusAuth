worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Foundation Core Phase 2 deliverable: "API gateway routing"
    # (NEXUS_ONE_ARCHITECTURE_PLAN §9 Phase 2, §6). One public entry
    # point (port 80) in front of every service that used to be reached
    # by its own raw port directly (§6's own "Accessing Services (Q1):
    # Without Nginx (direct port access)" section) — nexusAuth's API/UI
    # on 8000, and n8n's editor/webhooks on 5678.
    #
    # This file is the one docker-compose.yml mounts into the nginx
    # container — host.docker.internal, not 127.0.0.1, since from inside
    # that container the API and n8n are both still just processes on
    # the host (there is no api/ui Dockerfile in this repo yet). Running
    # nginx directly on the host instead (no Docker) uses the same
    # location blocks against 127.0.0.1 — see .nginx_local/ for that
    # copy, kept out of version control (it's this machine's actual
    # extracted nginx.org build, not project source).
    server {
        listen       80;
        server_name  localhost;

        location / {
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # n8n's editor UI + webhook endpoints, reachable through the same
        # gateway instead of its own separate port. Strips the /n8n
        # prefix before forwarding — n8n itself has no concept of being
        # served under a subpath here (a real deployment would set
        # N8N_PATH accordingly; out of scope for this dev setup).
        location /n8n/ {
            proxy_pass http://n8n:5678/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # n8n's editor UI holds a live WebSocket open for push
            # updates — without this Upgrade/Connection pair, the proxy
            # would silently downgrade it to a dead plain HTTP connection.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # TLS termination (the plan's other stated job for this Nginx
        # layer) is deliberately not configured here — there is no
        # certificate for a dev "localhost" that anything would trust.
        # The plan's own production checklist item ("Nginx reverse proxy
        # configured (TLS)") is a real-server deployment step.
    }
}
